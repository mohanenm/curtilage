name: Feature request
description: Something curtilage could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The use case (geofencing, delivery, analytics, ...) and what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A public place or made-up location where it matters. Never a private site.
