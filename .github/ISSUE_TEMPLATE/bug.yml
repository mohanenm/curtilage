name: Bug
description: Something crashes, errors or behaves differently from the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to the **Security** tab → **Report a vulnerability**, not here. Never include private site locations.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code that shows it
      description: With made-up or public locations only.
      render: shell
  - type: input
    id: version
    attributes:
      label: curtilage version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Ruby, DuckDB and operating system versions
  - type: textarea
    id: doctor
    attributes:
      label: Output of `curtilage doctor --json`
      render: json
