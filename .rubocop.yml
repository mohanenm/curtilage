AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "data/**/*"
    - "notes/**/*"
    - "vendor/**/*"
    # Homebrew formulas follow Homebrew's style (brew style), not ours.
    - "packaging/homebrew/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Geometry code reads best with the usual maths names.
Naming/MethodParameterName:
  AllowedNames: [a, b, id, o, p, q, p1, p2, p3, p4, x, y, x0, y0, x1, y1, dx, dy, xy]

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

# Numeric geometry routines are long and branchy by nature; keep the limits
# as a warning sign, not a straitjacket.
Metrics/AbcSize:
  Max: 30
  Exclude: ["test/**/*"]
Metrics/MethodLength:
  Max: 25
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ModuleLength:
  Max: 450
# AutoData (finding, building, caching and checking regions) is one job in
# one class; 120 lines keeps the warning without forcing an artificial split.
Metrics/ClassLength:
  Max: 120
  Exclude: ["test/**/*"]

# Keyword options are the public API's style; count positional ones only.
Metrics/ParameterLists:
  CountKeywordArgs: false
  Exclude: ["test/**/*"]
